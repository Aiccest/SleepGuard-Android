name: Build signed SleepMate release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/usage-access-sleepmate-redesign", "feature/power-saving-optimization", "feature/persistent-protection-recovery" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          SLEEPMATE_KEYSTORE_BASE64: ${{ secrets.SLEEPMATE_KEYSTORE_BASE64 }}
        run: |
          test -n "$SLEEPMATE_KEYSTORE_BASE64"
          echo "$SLEEPMATE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sleepmate-signing-2026.jks"
          test -s "$RUNNER_TEMP/sleepmate-signing-2026.jks"

      - name: Build signed release APK
        env:
          SLEEPMATE_STORE_FILE: ${{ runner.temp }}/sleepmate-signing-2026.jks
          SLEEPMATE_STORE_PASSWORD: ${{ secrets.SLEEPMATE_STORE_PASSWORD }}
          SLEEPMATE_KEY_ALIAS: ${{ secrets.SLEEPMATE_KEY_ALIAS }}
          SLEEPMATE_KEY_PASSWORD: ${{ secrets.SLEEPMATE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
